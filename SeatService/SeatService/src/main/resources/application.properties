spring.application.name=SEAT-SERVICE
server.port=8084

# DATABASE
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seat_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:naveenkumar123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# EUREKA
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# JWT
jwt.secret=${JWT_SECRET:myVeryLongSecretKeyForJwtAuthenticationProject123456}
jwt.expiration.ms=86400000

# SECURITY LOGS
logging.level.org.springframework.security=DEBUG