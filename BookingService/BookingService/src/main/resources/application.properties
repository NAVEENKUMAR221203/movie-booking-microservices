spring.application.name=BOOKING-SERVICE
server.port=8085

# DATABASE CONFIGURATION
# Connects to your dedicated booking service schema using your MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/booking_db
spring.datasource.username=root
spring.datasource.password=naveenkumar123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & HIBERNATE LOGGING
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# EUREKA SERVICE DISCOVERY
# Registers this app so RestTemplate can locate "http://SEAT-SERVICE" dynamically
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# JWT CONFIGURATION
# 🔥 CRITICAL: Must be identical to AUTH-SERVICE and SEAT-SERVICE to decode tokens successfully
jwt.secret=myVeryLongSecretKeyForJwtAuthenticationProject123456
jwt.expiration.ms=3600000

# SPRING SECURITY DEBUG LOGGING
# Helps you watch incoming token filter evaluations directly inside your IDE terminal console
logging.level.org.springframework.security=DEBUG